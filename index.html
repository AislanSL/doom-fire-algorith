<html>
    <head>
        <style>
            body {
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;

                background:
                    linear-gradient(
                        45deg,
                        #151515 25%,
                        transparent 25%
                    ) 0 0 / 16px 16px,
                    linear-gradient(
                        -45deg,
                        #151515 25%,
                        transparent 25%
                    ) 0 0 / 16px 16px,
                    #080808;

                color: #fff;
                font-family: monospace;
            }
            h1 {
                font-family: Impact;
                font-size: 35px;
            }
            table {
                border-collapse: collapse;
                border: 1px solid #000;
            }
            #fireCanvas {
                margin: 10px;
            }
            td {
                width: 50px;
                height: 50px;
                border: 1px solid #000;
                text-align: center;
                vertical-align: center;
                font-family: monospace;
                position: relative;
            }

            .pixel-index {
                font-size: 10px;
                display: inline-block;
                position: absolute;
                top:2px;
                right: 2px;
                color: #999;
            }

            td.pixel {
                width: 4px;
                height: 4px;
                border: 0;
            }
        </style>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <title>Page Title</title>
    </head>
    <body>
       <center>
           <h1>Doom Fire Effect</h1>
           <div id="fireCanvas"></div>
           <div>
            <button onclick="createFireSource()">Max Fire</button>
            <button onclick="destroyFireSource()">Min Fire</button>
           </div>
       </center>
        
            <script src="fire.js"></script>
    </body>
</html>
